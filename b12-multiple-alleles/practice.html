<div id="practice"></div></main><footer>Nilasha Sempon · Science &amp; Biology · Al Dhahara Girls School, Hatta</footer><script>window.PRACTICE={"mcq": [{"q": "Multiple allele traits are controlled by…", "opts": ["many genes with two alleles", "one gene with more than two alleles", "one gene with one allele", "genes on the Y chromosome"], "ok": 1, "hint": "Hint: ONE gene, MANY alleles."}, {"q": "What is the genotype of a person with blood type O?", "opts": ["I<sup>A</sup>i", "I<sup>A</sup>I<sup>B</sup>", "ii", "I<sup>B</sup>i"], "ok": 2, "hint": "Hint: O is recessive."}, {"q": "A rabbit with genotype c<sup>ch</sup>c<sup>h</sup> is…", "opts": ["full colour", "chinchilla", "Himalayan", "albino"], "ok": 1, "hint": "Hint: c<sup>ch</sup> is above c<sup>h</sup> in the hierarchy."}, {"q": "Blood type AB shows that I<sup>A</sup> and I<sup>B</sup> are…", "opts": ["recessive", "incompletely dominant", "sex-linked", "codominant"], "ok": 3, "hint": "Hint: red AND blue stripes."}, {"q": "Which two terms best describe the inheritance of human blood types?", "opts": ["incomplete dominance and codominance", "codominance and multiple alleles", "incomplete dominance and multiple alleles", "codominance and epistasis"], "ok": 1, "hint": ""}, {"q": "Parents I<sup>A</sup>i × I<sup>B</sup>i. What fraction of their children are expected to be type O?", "opts": ["0", "1/4", "1/2", "3/4"], "ok": 1, "hint": ""}, {"q": "The order of dominance for rabbit coat colour is…", "opts": ["c > c<sup>h</sup> > c<sup>ch</sup> > C", "C > c<sup>h</sup> > c<sup>ch</sup> > c", "C > c<sup>ch</sup> > c<sup>h</sup> > c", "all four are codominant"], "ok": 2, "hint": ""}, {"q": "Chinchilla (c<sup>ch</sup>c) × Himalayan (c<sup>h</sup>c). Which phenotypes can the offspring have?", "opts": ["only chinchilla", "full colour and albino", "2 chinchilla : 1 Himalayan : 1 albino", "1 chinchilla : 1 Himalayan"], "ok": 2, "hint": ""}, {"q": "Which statement about multiple alleles is true?", "opts": ["Each person carries all three ABO alleles", "More alleles increase the number of possible genotypes and phenotypes", "Multiple alleles are always codominant", "Multiple alleles are only found in animals"], "ok": 1, "hint": ""}], "tf": [{"q": "A gamete carries only one allele of each gene.", "a": "T", "why": "Gametes are haploid: one allele per gene."}, {"q": "Every gene has only two possible alleles in a population.", "a": "F", "why": "Some genes have three or more alleles: multiple alleles."}, {"q": "In codominance, both alleles are fully expressed.", "a": "T", "why": "Example: IAIB gives blood type AB."}, {"q": "A person can carry three different ABO alleles.", "a": "F", "why": "Each person carries only TWO alleles, one from each parent."}, {"q": "Blood type O is caused by two recessive alleles (ii).", "a": "T", "why": "i is recessive to both IA and IB."}], "kw": [{"w": "Allele", "d": "A different form of the same gene."}, {"w": "Multiple alleles", "d": "One gene with more than two alleles in a population."}, {"w": "Codominance", "d": "Both alleles are fully expressed in the heterozygote (e.g. I<sup>A</sup>I<sup>B</sup> = AB)."}, {"w": "Incomplete dominance", "d": "The heterozygote shows an intermediate (blended) phenotype."}, {"w": "ABO blood group system", "d": "Three alleles: I<sup>A</sup>, I<sup>B</sup> and i give blood types A, B, AB and O."}, {"w": "Full coat colour", "d": "Rabbit phenotype from allele C, dominant over all the others."}, {"w": "Chinchilla · Himalayan", "d": "Grey rabbit (c<sup>ch</sup>) · white rabbit with dark ears, nose and feet (c<sup>h</sup>)."}, {"w": "Albino", "d": "White rabbit with pink eyes: genotype cc (c is recessive to all)."}]};</script><script src="../assets/teach.js"></script></body></html>
